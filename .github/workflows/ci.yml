name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit release source
        run: python -X utf8 scripts/check_release.py
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test Python backend
        # The two optional QR vendor smoke tests skip without the account CLI.
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --reporter=dot
